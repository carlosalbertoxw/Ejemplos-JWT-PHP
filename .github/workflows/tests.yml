name: Pruebas

on:
  # push solo en master: en las ramas de los PR ya corre por pull_request
  # (si no, cada PR ejecutaría el workflow dos veces).
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: phpstan:2.3

      - name: Verificar sintaxis de todos los archivos PHP
        run: |
          find api webapp -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "Sintaxis OK"

      - name: Análisis estático (PHPStan)
        run: phpstan analyse --no-progress

      - name: Ejecutar pruebas unitarias
        run: php api/tests/run.php

      - name: Validar el contrato OpenAPI
        run: npx --yes @redocly/cli@2 lint api/public/openapi.json

  docker:
    # Construye las imágenes y levanta el stack con docker compose. Así se
    # prueban de verdad los Dockerfiles (y los PR de Dependabot que cambian sus
    # imágenes base) y que los health checks respondan.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir y levantar
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs

      - name: Detener
        if: always()
        run: docker compose down --volumes
